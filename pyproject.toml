[project]
name = "pythonid-bot"
version = "0.1.0"
description = "Telegram bot that monitors group messages and warns users without public profile pictures or usernames"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "logfire>=2.6.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "python-telegram-bot[job-queue]>=22.5",
    "sqlmodel>=0.0.28",
]

[project.scripts]
pythonid-bot = "bot.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[dependency-groups]
dev = [
    "hypothesis>=6.155.3",
    "mypy>=2.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/bot"]
omit = ["*/tests/*", "src/bot/main.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
# Pragmatic starting point. Tighten module-by-module via overrides below.
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = true
# Allow gradual adoption: only block on errors that point to real bugs
disallow_untyped_defs = false
disallow_any_generics = false
# Disable error codes that are noisy from PTB / SQLModel / Pydantic v2.
# The team will tighten module-by-module over time. New code should still
# be free of these errors when added.
disable_error_code = [
    "arg-type",      # PTB callback data typed as object
    "attr-defined",  # Pydantic v2 model access via dict unpacking
    "index",         # object indexing
    "union-attr",    # Optional access (we add None checks where it matters)
    "misc",          # Generator type variance
    "return-value",  # Pydantic v2 return narrowing
    "call-arg",      # Pydantic v2 argument coercion
]

[[tool.mypy.overrides]]
# New code should be strict; existing modules opt in as they're touched.
module = "tests.test_properties"
disallow_untyped_defs = true
check_untyped_defs = true
