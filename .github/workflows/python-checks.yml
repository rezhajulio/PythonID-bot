name: Python Code Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Lint and type-check on the floor of requires-python. UV_PYTHON is set
    # explicitly because `uv sync` resolves its interpreter from
    # .python-version, which would otherwise override actions/setup-python.
    env:
      UV_PYTHON: "3.11"
      UV_PYTHON_DOWNLOADS: never

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint with ruff
      run: |
        uv run ruff check . --statistics

    - name: Type-check with mypy
      run: |
        uv run mypy src/bot/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    # UV_PYTHON must track the matrix entry: `uv sync` reads .python-version,
    # so without it every job would resolve to the same interpreter.
    # Downloads are disabled so a missing interpreter fails loudly rather
    # than silently fetching a different one.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      run: pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --dev

    - name: Test with pytest
      run: |
        uv run pytest
